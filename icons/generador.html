<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chip — generador de íconos</title>
<style>
  body {
    background: #0d0f14;
    color: #e6e6e6;
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: #9aa0ab; font-size: 13px; max-width: 60ch; margin: 0 0 20px; }
  .par { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  figcaption { font-size: 12px; color: #9aa0ab; }
  canvas { border: 1px solid #2a2d38; border-radius: 8px; image-rendering: pixelated; }
  button {
    background: #1e2129;
    border: 1px solid #2a2d38;
    border-radius: 6px;
    color: #e6e6e6;
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { background: #262a35; }
</style>
</head>
<body>
<h1>Generador de íconos</h1>
<p>
  Dibuja los dos PNG que pide <code>manifest.json</code> y los baja al disco.
  Movelos a <code>/icons/</code> pisando los que ya están. Cero herramientas
  externas: es sólo canvas. Cuando exista el sprite definitivo de Chip, esto se
  reemplaza por el arte real.
</p>

<div class="par" id="par"></div>

<script type="module">
import { PLACEHOLDER } from '../js/config.js';

const TAMANOS = [192, 512];
const FONDO = '#0d0f14';
const OJO = '#4ade80';

function dibujar(canvas, n) {
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = FONDO;
  ctx.fillRect(0, 0, n, n);

  // Mismo lenguaje visual que el placeholder del canvas del juego: cuerpo
  // centrado con borde. Los ojos son lo único que se agrega, para que el ícono
  // se lea como robot y no como un cuadrado suelto.
  const lado = n * PLACEHOLDER.proporcion * 1.12;
  const ini = (n - lado) / 2;
  const grosor = Math.max(1, Math.round(n / 64));

  ctx.fillStyle = PLACEHOLDER.colorRelleno;
  ctx.fillRect(ini, ini, lado, lado);

  ctx.strokeStyle = PLACEHOLDER.colorBorde;
  ctx.lineWidth = grosor;
  ctx.strokeRect(ini + grosor / 2, ini + grosor / 2, lado - grosor, lado - grosor);

  ctx.fillStyle = OJO;
  const ojoAncho = n * 0.09;
  const ojoAlto = n * 0.1;
  const ojoY = n * 0.4;
  ctx.fillRect(n * 0.35, ojoY, ojoAncho, ojoAlto);
  ctx.fillRect(n * 0.56, ojoY, ojoAncho, ojoAlto);
}

const contenedor = document.getElementById('par');

for (const n of TAMANOS) {
  const figura = document.createElement('figure');

  const canvas = document.createElement('canvas');
  canvas.width = n;
  canvas.height = n;
  canvas.style.width = '192px';
  canvas.style.height = '192px';
  dibujar(canvas, n);

  const pie = document.createElement('figcaption');
  pie.textContent = `icon-${n}.png — ${n}×${n}`;

  const boton = document.createElement('button');
  boton.type = 'button';
  boton.textContent = `bajar icon-${n}.png`;
  boton.addEventListener('click', () => {
    const enlace = document.createElement('a');
    enlace.download = `icon-${n}.png`;
    enlace.href = canvas.toDataURL('image/png');
    enlace.click();
  });

  figura.append(canvas, pie, boton);
  contenedor.appendChild(figura);
}
</script>
</body>
</html>
