<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chip — generador de íconos</title>
<style>
  body {
    background: #0d0f14;
    color: #e6e6e6;
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: #9aa0ab; font-size: 13px; max-width: 60ch; margin: 0 0 20px; }
  .par { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  figcaption { font-size: 12px; color: #9aa0ab; }
  canvas { border: 1px solid #2a2d38; border-radius: 8px; image-rendering: pixelated; }
  button {
    background: #1e2129;
    border: 1px solid #2a2d38;
    border-radius: 6px;
    color: #e6e6e6;
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { background: #262a35; }
</style>
</head>
<body>
<h1>Generador de íconos</h1>
<p>
  Dibuja los dos PNG que pide <code>manifest.json</code> y los baja al disco.
  Movelos a <code>/icons/</code> pisando los que ya están. Cero herramientas
  externas: es sólo canvas. Ahora dibuja a Chip de verdad, desde
  <code>sprites/idle.png</code>, sobre el fondo del juego.
</p>

<div class="par" id="par"></div>

<script type="module">
import { RUTAS_SPRITES } from '../js/config.js';

const TAMANOS = [192, 512];

// El charcoal del juego: mismo valor que background_color y theme_color de
// manifest.json y que el body de style.css. Un ícono transparente lo pinta cada
// launcher a su manera, casi siempre en blanco.
const FONDO = '#0d0f14';

// Este archivo vive en /icons/, así que la ruta del sprite —que es
// document-relative en config.js— necesita subir un nivel.
const RUTA_IDLE = '../' + RUTAS_SPRITES.idle;

const TAMANO_SPRITE = 256;

function cargar(ruta) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('no se pudo cargar ' + ruta));
    img.src = ruta;
  });
}

function dibujar(canvas, n, chip) {
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = FONDO;
  ctx.fillRect(0, 0, n, n);

  // Mismo encuadre que el canvas del juego: el sprite ocupa todo el cuadrado y
  // el aire se lo da el margen transparente que ya trae el arte.
  //
  // El suavizado se decide por el sentido del escalado: 512 es exactamente 2x de
  // 256 y nearest lo deja perfecto; 192 es una reducción a 0,75 y con nearest se
  // caerían filas enteras de píxeles justo en la cara. Ahí conviene suavizar.
  ctx.imageSmoothingEnabled = n < TAMANO_SPRITE;
  ctx.drawImage(chip, 0, 0, n, n);
}

const chip = await cargar(RUTA_IDLE);

const contenedor = document.getElementById('par');

for (const n of TAMANOS) {
  const figura = document.createElement('figure');

  const canvas = document.createElement('canvas');
  canvas.width = n;
  canvas.height = n;
  canvas.style.width = '192px';
  canvas.style.height = '192px';
  dibujar(canvas, n, chip);

  const pie = document.createElement('figcaption');
  pie.textContent = `icon-${n}.png — ${n}×${n}`;

  const boton = document.createElement('button');
  boton.type = 'button';
  boton.textContent = `bajar icon-${n}.png`;
  boton.addEventListener('click', () => {
    const enlace = document.createElement('a');
    enlace.download = `icon-${n}.png`;
    enlace.href = canvas.toDataURL('image/png');
    enlace.click();
  });

  figura.append(canvas, pie, boton);
  contenedor.appendChild(figura);
}
</script>
</body>
</html>
