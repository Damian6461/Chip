<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: la escena llega hasta el borde físico de la pantalla,
     por debajo del notch y de la barra de gestos. Lo que no puede quedar tapado
     es la botonera, que se protege con env(safe-area-inset-*) en style.css. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chip</title>
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- La escena ES el juego. No hay panel, no hay tarjeta, no hay marco: el
     galpón ocupa la pantalla y todo lo demás vive adentro de él. En desktop se
     limita a una columna vertical de teléfono; en mobile es la pantalla entera. -->
<div id="escena">

  <!-- Polvo en el aire del galpón, al fondo de todo. Son dieciséis y ocupan la
       escena entera, no sólo el haz: el galpón tiene polvo en todos lados y el
       haz es donde SE VE. Las seis primeras llevan `en-luz` porque caen en la
       columna de la ventana, y ésas brillan al doble. -->
  <div id="polvo" aria-hidden="true">
    <div class="mota en-luz"></div>
    <div class="mota en-luz"></div>
    <div class="mota en-luz"></div>
    <div class="mota en-luz"></div>
    <div class="mota en-luz"></div>
    <div class="mota en-luz"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
    <div class="mota"></div>
  </div>

  <!-- La toma de corriente. Es mobiliario del galpón, no un accesorio del
       estado cargando: está siempre, en todos los estados, y existe para que el
       cable dibujado en cargando.png termine en algo. Va antes de #chip y con
       z-index negativo para quedar detrás de él y DEBAJO de la capa de luz, que
       es lo que le da la hora del día. La forma la dibuja ui.js. -->
  <div id="toma" aria-hidden="true"></div>

  <!-- La caja de Chip: define dónde pisa y cuánto mide, y NO se anima nunca.
       Adentro, la sombra queda quieta y el contenedor rebota; por eso al saltar
       Chip se despega y la sombra se queda en el piso. -->
  <div id="chip" role="button" tabindex="0" aria-label="Ver el estado de Chip">
    <div id="sombra" aria-hidden="true"></div>

    <div id="contenedor-mascota">
      <!-- 256x256 = el tamaño nativo de los sprites. El canvas no reescala
           nada: dibuja 1 a 1 y el CSS lo lleva al tamaño de la escena. -->
      <canvas id="canvas-mascota" width="256" height="256"></canvas>

      <!-- La pantalla del pecho, viva. Tapa la que está pintada en el sprite
           —que decía siempre 100%— y muestra la batería de verdad. Va justo
           encima del canvas y debajo de todo lo demás: es parte del cuerpo, no
           un efecto. Su contenido y su posición los escribe ui.js desde la
           tabla medida de config.js. -->
      <div id="pantalla" aria-hidden="true" hidden>
        <div id="pantalla-segmentos"></div>
        <div id="pantalla-numero"></div>
      </div>

      <!-- El párpado: el mismo recorte usado como máscara y rellenado de un
           color plano. Tapa los ojos que el sprite base trae dibujados, para que
           al cerrarse no asomen por arriba y por abajo de la capa de ojos.
           En reposo no se ve: queda exactamente debajo. -->
      <div id="parpado" aria-hidden="true" hidden></div>

      <!-- La capa de ojos, para el parpadeo. Es el mismo lienzo de 256 que el
           cuerpo y se escala igual, así que se apoya encima sin corrimiento.
           ui.js le cambia el src según el estado y la esconde en los que no
           tienen recorte. -->
      <img id="ojos" alt="" aria-hidden="true" hidden>

      <div id="efectos" aria-hidden="true">
        <div id="antena"></div>

        <!-- Los corazones de feliz y las chispas amarillas, que antes estaban
             dibujados en el sprite. Ahora son partículas: además de flotar,
             pueden dispararse por evento. Los llena ui.js. -->
        <div id="corazones"></div>
        <div id="destellos"></div>
        <div id="corazones-extra"></div>

        <!-- Un efecto por estado, cada uno con su comportamiento: no son
             partículas genéricas recoloreadas. Los llena ui.js. -->
        <div id="rayitas"></div>
        <div id="pulsos"></div>
        <div id="latido-rayo"></div>
        <div id="burbujas"></div>

        <div id="zetas">
          <span class="zeta">z</span>
          <span class="zeta">z</span>
          <span class="zeta">z</span>
        </div>

        <div id="chispas">
          <div class="chispa"></div>
          <div class="chispa"></div>
          <div class="chispa"></div>
          <div class="chispa"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- El rincón de Chip: lo que juntó, apoyado en el piso bajo su ventana.
       El contenido lo escribe ui.js desde la colección del save. -->
  <div id="estante" role="button" tabindex="0" aria-label="Ver la colección de Chip"></div>

  <!-- La colección entera. Se abre tocando el rincón. -->
  <div id="coleccion" hidden>
    <p id="coleccion-titulo">Lo que juntó</p>
    <div id="coleccion-grilla"></div>
    <p id="coleccion-detalle"></p>

    <p id="gigantes-titulo">Los grandes</p>
    <div id="gigantes-grilla"></div>
    <p id="gigantes-detalle"></p>
  </div>

  <!-- El estado no vive en pantalla: vive en Chip. Esto aparece al tocarlo y se
       va solo, como abrir la tapa del pecho para mirar los números. -->
  <div id="estado" hidden>
    <div id="barra-bateria" class="barra">
      <span class="barra-etiqueta">Batería</span>
      <div class="barra-pista">
        <div id="barra-bateria-fill" class="barra-fill"></div>
      </div>
      <span id="barra-bateria-valor" class="barra-valor">100</span>
    </div>

    <div id="barra-humor" class="barra">
      <span class="barra-etiqueta">Humor</span>
      <div class="barra-pista">
        <div id="barra-humor-fill" class="barra-fill"></div>
      </div>
      <span id="barra-humor-valor" class="barra-valor">100</span>
    </div>

    <div id="barra-mantenimiento" class="barra">
      <span class="barra-etiqueta">Mant.</span>
      <div class="barra-pista">
        <div id="barra-mantenimiento-fill" class="barra-fill"></div>
      </div>
      <span id="barra-mantenimiento-valor" class="barra-valor">100</span>
    </div>
  </div>

  <!-- El evento es texto en el mundo, apoyado sobre el piso del galpón. -->
  <p id="evento" class="evento" hidden></p>

  <!-- La botonera vive en el piso de la pantalla, al alcance del pulgar. -->
  <div id="acciones">
    <button id="btn-cargar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      <span>Cargar</span>
    </button>
    <button id="btn-jugar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M6 8c4 2 8 2 12 0M6 16c4-2 8-2 12 0"/></svg>
      <span>Jugar</span>
    </button>
    <button id="btn-limpiar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3 8 9M17 6l-6 6M6 13l5 5-4 3-4-4z"/></svg>
      <span>Limpiar</span>
    </button>
  </div>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
