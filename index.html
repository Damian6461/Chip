<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chip</title>
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="escenario">
  <!-- El panel lleva el marco y el fondo del galpón (background-image, que ui.js
       cambia entre día y noche). Es la capa de atrás y no se mueve nunca.

       El contenedor de adentro existe para animar: lleva el rebote permanente, y
       el canvas lleva el salto de acción. Ver el bloque de animaciones en
       style.css: dos transforms en elementos anidados se componen; dos
       animaciones en el mismo elemento se pisan. -->
  <div id="panel-juego">
    <!-- Efectos de vida. Todo lo de acá es decoración superpuesta: ninguno toca
         el canvas ni los PNG, ninguno recibe el mouse y ninguno existe para un
         lector de pantalla. Los que dependen del estado de Chip se prenden por
         la clase que ui.js pone en el contenedor, derivada de la cadena: no hay
         un solo timer nuevo en el JS. -->

    <!-- Polvo en el haz de la ventana. Al fondo de todo y sólo de día. -->
    <div id="polvo" aria-hidden="true">
      <div class="mota"></div>
      <div class="mota"></div>
      <div class="mota"></div>
      <div class="mota"></div>
      <div class="mota"></div>
      <div class="mota"></div>
    </div>

    <!-- La sombra vive afuera del contenedor que rebota, a propósito: cuando
         Chip salta por una acción, la sombra se queda en el piso. Eso es lo que
         vende el despegue. -->
    <div id="sombra" aria-hidden="true"></div>

    <div id="contenedor-mascota">
      <canvas id="canvas-mascota" width="320" height="320"></canvas>

      <!-- Estos van adentro del contenedor porque tienen que moverse CON Chip:
           si el glow no rebotara, se despegaría de la antena. -->
      <div id="efectos" aria-hidden="true">
        <div id="antena"></div>

        <div id="zetas">
          <span class="zeta">z</span>
          <span class="zeta">z</span>
          <span class="zeta">z</span>
        </div>

        <div id="chispas">
          <div class="chispa"></div>
          <div class="chispa"></div>
          <div class="chispa"></div>
          <div class="chispa"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="barra-bateria" class="barra">
    <span class="barra-etiqueta">Batería</span>
    <div class="barra-pista">
      <div id="barra-bateria-fill" class="barra-fill"></div>
    </div>
    <span id="barra-bateria-valor" class="barra-valor">100</span>
  </div>

  <div id="barra-humor" class="barra">
    <span class="barra-etiqueta">Humor</span>
    <div class="barra-pista">
      <div id="barra-humor-fill" class="barra-fill"></div>
    </div>
    <span id="barra-humor-valor" class="barra-valor">100</span>
  </div>

  <div id="barra-mantenimiento" class="barra">
    <span class="barra-etiqueta">Mant.</span>
    <div class="barra-pista">
      <div id="barra-mantenimiento-fill" class="barra-fill"></div>
    </div>
    <span id="barra-mantenimiento-valor" class="barra-valor">100</span>
  </div>

  <div id="acciones">
    <button id="btn-cargar" type="button">Cargar</button>
    <button id="btn-jugar" type="button">Jugar</button>
    <button id="btn-limpiar" type="button">Limpiar</button>
  </div>

  <div id="eventos" hidden></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
